name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Record the size of the single file
        run: |
          echo "dist/index.html is $(wc -c < dist/index.html) bytes" >> "$GITHUB_STEP_SUMMARY"
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
