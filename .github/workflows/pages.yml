name: Pages

# Publishes the viewer with the bundled demos to GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time. A newer push waits for the one in progress instead of cancelling it,
# so a deployment is never cut off half way; runs still waiting behind it are dropped.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist/viewer

  # A separate job, as GitHub's own Pages workflows have it. Deploying in the same job, a second
  # after the upload, sometimes asked for the artifact before it could be found
  # ("No artifacts named github-pages were found").
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: first
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        continue-on-error: true
      - name: Wait before one more try
        if: steps.first.outcome == 'failure'
        run: sleep 20
      - id: second
        if: steps.first.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
      - id: deploy
        name: Report the address
        env:
          PAGE_URL: ${{ steps.first.outputs.page_url || steps.second.outputs.page_url }}
        run: echo "page_url=$PAGE_URL" >> "$GITHUB_OUTPUT"
