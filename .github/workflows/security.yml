name: Security

# Static checks for secrets, risky code, risky workflows and vulnerable dependencies.
# docs/security.md says what each job looks for and how to run it locally.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a newly published advisory or rule is noticed without a push.
    - cron: '17 6 * * 1'

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  secrets:
    name: Secrets in the history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every commit, not only the newest: a secret removed later is still public.
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks, checking its checksum
        run: scripts/security/install-gitleaks.sh "$RUNNER_TEMP/bin"
      - name: Scan every commit
        run: '"$RUNNER_TEMP/bin/gitleaks" git . --redact --no-banner --verbose'

  package:
    name: Secrets in what is published
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the package and unpack it as npm would ship it
        run: |
          mkdir -p "$RUNNER_TEMP/pack" "$RUNNER_TEMP/unpacked"
          pnpm pack --pack-destination "$RUNNER_TEMP/pack"
          tar -xzf "$RUNNER_TEMP"/pack/*.tgz -C "$RUNNER_TEMP/unpacked"
      - name: Install gitleaks, checking its checksum
        run: scripts/security/install-gitleaks.sh "$RUNNER_TEMP/bin"
      - name: Scan the files in the package
        run: '"$RUNNER_TEMP/bin/gitleaks" dir "$RUNNER_TEMP/unpacked" --config .gitleaks.toml --redact --no-banner --verbose'
      - name: Check that nothing private is in the package
        run: node scripts/security/check-package-files.mjs "$RUNNER_TEMP/unpacked/package"

  workflows:
    name: Workflow files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: 1.32.0
          # Fail this job on a finding, instead of only filing it under Code scanning.
          advanced-security: false
          annotations: true

  dependencies:
    name: Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Known vulnerabilities in what is installed
        run: pnpm audit --audit-level moderate
      - name: Vulnerabilities this pull request would add
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate

  codeql:
    name: Code analysis (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets CodeQL file what it finds under Security, Code scanning.
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:${{ matrix.language }}
